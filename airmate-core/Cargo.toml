[package]
name = "airmate-core"
version = "0.1.0"
edition = "2021"
authors = ["John Ky <newhoggy@gmail.com>"]
license = "BSD-3-Clause"
description = "The sans-I/O translation core of airmate: IR, protocol adapters, field policy and stream state machines."
repository = "https://github.com/rust-works/airmate"
documentation = "https://docs.rs/airmate-core"
readme = "README.md"
keywords = ["ai", "llm", "anthropic", "openai", "translation"]
categories = ["api-bindings"]
rust-version = "1.88.0"

[dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
proptest = "1.12.0"
