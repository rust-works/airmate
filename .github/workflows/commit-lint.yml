name: Commit Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue entries. Branch filters are not supported on this event.
  merge_group:

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Deterministic, no-AI validation: runs `omni-dev git commit message lint`,
      # so there is no API key and no network call beyond fetching the binary.
      - uses: action-works/omni-dev-commit-check@v1.4
        with:
          command: lint
          strict: true
          # The action only derives a range for pull_request events. For a
          # merge-queue entry, lint exactly the commits the queue adds to main.
          commit-range: ${{ github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || '' }}
