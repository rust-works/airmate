name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" \
          --title "$GITHUB_REF_NAME" \
          --generate-notes

  build-release:
    name: Build Release (${{ matrix.build }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        build: [linux, linux-arm64, macos, win-msvc]
        include:
        # The Linux legs build on a pinned image, never `ubuntu-latest`: the
        # binaries link dynamically against that image's glibc, so a moving
        # label would raise the oldest supported host unannounced.
        - build: linux
          os: ubuntu-22.04
          target: x86_64-unknown-linux-gnu
          archive-name: airmate-linux.tar.gz
        # Built natively on GitHub's hosted ARM64 runner rather than cross-compiled.
        - build: linux-arm64
          os: ubuntu-22.04-arm
          target: aarch64-unknown-linux-gnu
          archive-name: airmate-linux-arm64.tar.gz
        - build: macos
          os: macos-latest
          target: aarch64-apple-darwin
          archive-name: airmate-macos-arm64.tar.gz
        - build: win-msvc
          os: windows-latest
          target: x86_64-pc-windows-msvc
          archive-name: airmate-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build release binary
      run: cargo build --verbose --release --target ${{ matrix.target }}

    - name: Strip release binary (everything but windows)
      if: matrix.build != 'win-msvc'
      run: strip "target/${{ matrix.target }}/release/airmate"

    # The Linux binaries link glibc dynamically, so the newest glibc symbol they use is the
    # oldest host they run on. ubuntu-22.04 ships glibc 2.35; fail if a build needs more.
    - name: Check the glibc floor
      if: startsWith(matrix.build, 'linux')
      run: ./scripts/check-glibc-floor.sh "target/${{ matrix.target }}/release/airmate" 2.35

    - name: Build archive
      shell: bash
      run: |
        mkdir archive
        cp LICENSE README.md archive/
        if [ "${{ matrix.build }}" = "win-msvc" ]; then
          cp "target/${{ matrix.target }}/release/airmate.exe" archive/
          cd archive
          7z a "${{ matrix.archive-name }}" ./*
        else
          cp "target/${{ matrix.target }}/release/airmate" archive/
          cd archive
          tar czf "${{ matrix.archive-name }}" ./*
        fi

    - name: Checksum the archive
      shell: bash
      working-directory: archive
      run: |
        if command -v sha256sum >/dev/null; then
          sha256sum "${{ matrix.archive-name }}" > "${{ matrix.archive-name }}.sha256"
        else
          shasum -a 256 "${{ matrix.archive-name }}" > "${{ matrix.archive-name }}.sha256"
        fi

    - name: Upload release archive
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "$GITHUB_REF_NAME" \
          "archive/${{ matrix.archive-name }}" \
          "archive/${{ matrix.archive-name }}.sha256" \
          --repo "$GITHUB_REPOSITORY"

  # Fills the Homebrew formula template with the release's version and checksums and attaches it
  # to the release. Copy `airmate.rb` into the tap.
  homebrew-formula:
    name: Homebrew formula
    runs-on: ubuntu-latest
    needs: build-release
    steps:
    - uses: actions/checkout@v7
    - name: Render the formula
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        mkdir dist
        gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.sha256'
        sha() { cut -d' ' -f1 "dist/$1.sha256"; }
        sed -e "s/@VERSION@/$version/g" \
            -e "s/@SHA_MACOS_ARM64@/$(sha airmate-macos-arm64.tar.gz)/" \
            -e "s/@SHA_LINUX@/$(sha airmate-linux.tar.gz)/" \
            -e "s/@SHA_LINUX_ARM64@/$(sha airmate-linux-arm64.tar.gz)/" \
            packaging/homebrew/airmate.rb.template > airmate.rb
        ! grep -q '@' airmate.rb
        gh release upload "$GITHUB_REF_NAME" airmate.rb --repo "$GITHUB_REPOSITORY" --clobber

  # The container image, on GitHub's registry under the repository's own name.
  publish-container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Work out the tags
      id: tags
      run: |
        version="${GITHUB_REF_NAME#v}"
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        echo "list=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.tags.outputs.list }}

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [create-release, build-release]
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    # airmate depends on airmate-core by version, so the core goes first; `cargo publish` waits
    # until the registry index has it before returning.
    - name: Publish airmate-core
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish -p airmate-core
    - name: Publish airmate
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish -p airmate
