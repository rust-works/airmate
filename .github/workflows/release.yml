name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" \
          --title "$GITHUB_REF_NAME" \
          --generate-notes

  build-release:
    name: Build Release (${{ matrix.build }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        build: [linux, linux-arm64, macos, win-msvc]
        include:
        # The Linux legs build on a pinned image, never `ubuntu-latest`: the
        # binaries link dynamically against that image's glibc, so a moving
        # label would raise the oldest supported host unannounced.
        - build: linux
          os: ubuntu-22.04
          target: x86_64-unknown-linux-gnu
          archive-name: airmate-linux.tar.gz
        # Built natively on GitHub's hosted ARM64 runner rather than cross-compiled.
        - build: linux-arm64
          os: ubuntu-22.04-arm
          target: aarch64-unknown-linux-gnu
          archive-name: airmate-linux-arm64.tar.gz
        - build: macos
          os: macos-latest
          target: aarch64-apple-darwin
          archive-name: airmate-macos-arm64.tar.gz
        - build: win-msvc
          os: windows-latest
          target: x86_64-pc-windows-msvc
          archive-name: airmate-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build release binary
      run: cargo build --verbose --release --target ${{ matrix.target }}

    - name: Strip release binary (everything but windows)
      if: matrix.build != 'win-msvc'
      run: strip "target/${{ matrix.target }}/release/airmate"

    - name: Build archive
      shell: bash
      run: |
        mkdir archive
        cp LICENSE README.md archive/
        if [ "${{ matrix.build }}" = "win-msvc" ]; then
          cp "target/${{ matrix.target }}/release/airmate.exe" archive/
          cd archive
          7z a "${{ matrix.archive-name }}" ./*
        else
          cp "target/${{ matrix.target }}/release/airmate" archive/
          cd archive
          tar czf "${{ matrix.archive-name }}" ./*
        fi

    - name: Upload release archive
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "$GITHUB_REF_NAME" \
          "archive/${{ matrix.archive-name }}" \
          --repo "$GITHUB_REPOSITORY"

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [create-release, build-release]
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish
